{% extends 'base.html' %}

{% block title %}Delete Medicine - MedFinder{% endblock %}

{% block content %}
<section class="py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0">Delete Medicine</h5>
                    </div>
                    <div class="card-body text-center p-5">
                        <i class="fas fa-exclamation-triangle fa-4x text-danger mb-4"></i>
                        <h4 class="mb-3">Are you sure you want to delete this medicine?</h4>
                        <p class="mb-1"><strong>Name:</strong> {{ medicine.name }}</p>
                        <p class="mb-4"><strong>Price:</strong> ${{ medicine.price }}</p>
                        <p class="text-muted mb-4">This action cannot be undone.</p>
                        
                        <form method="post">
                            {% csrf_token %}
                            <div class="d-flex justify-content-center">
                                <a href="{% url 'medicine_list' %}" class="btn btn-outline-secondary me-3">
                                    <i class="fas fa-times me-2"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-danger">
                                    <i class="fas fa-trash me-2"></i> Delete
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
